name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only is all CI needs; the token is here so that the GitHub API
# calls Quarto makes are authenticated rather than rate-limited.
permissions:
  contents: read

jobs:
  lint:
    name: PEP 8 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          # One cache per job: otherwise they race to save the same key.
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The platforms of the README's table: macos-latest is Apple
        # Silicon and macos-15-intel is x86-64, which cypari2 has separate
        # wheels for.  The other jobs do not depend on the operating system
        # and stay on Linux.
        os: [ubuntu-latest, macos-latest, macos-15-intel]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ github.job }}-${{ matrix.os }}-${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  quarto:
    name: Jupyter and Quarto (HTML and PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          # One cache per job: otherwise they race to save the same key.
          cache-suffix: ${{ github.job }}
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
        env:
          # Quarto asks the GitHub API which TinyTeX release is current.
          # Unauthenticated, that call shares the runner's rate limit and
          # comes back 403, which fails the job.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --locked
      # Without Quarto the other jobs skip these tests; here they must run.
      - run: uv run pytest tests/notebooks tests/examples -rs
        env:
          ER2_REQUIRE_QUARTO: "1"

  pari-table:
    name: PARI function table in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          # One cache per job: otherwise they race to save the same key.
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked
      - run: uv run python tools/sync_pari_functions.py
      - name: Generated files must be committed
        run: git diff --exit-code -- er2/data docs
