<circle cx="740.0" cy="113.8" r="3" fill="#ff7f0e"/>
<rect x="70" y="373" width="12" height="12" fill="#ff7f0e"/><text x="88" y="383">limit of (sin(kx) - kx) / x^3 at 0</text>
</svg>
