<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" font-family="sans-serif" font-size="12">
<title>Calculus and series</title>
<rect width="760" height="410" fill="white"/>
<line x1="70" x2="740" y1="141.1" y2="141.1" stroke="#e5e5e5"/><text x="64" y="145.1" text-anchor="end">×1</text>
<line x1="70" x2="740" y1="141.1" y2="141.1" stroke="black" stroke-dasharray="5 3"/><text x="740" y="137.1" text-anchor="end">as fast as the reference</text>
<text x="405.0" y="276" text-anchor="middle" font-size="10">2026-11-25 b44083f</text>
<circle cx="405.0" cy="140.8" r="3" fill="#1f77b4"/>
<rect x="70" y="301" width="12" height="12" fill="#1f77b4"/><text x="88" y="311">expand((x + k)^20)</text>
<circle cx="405.0" cy="142.3" r="3" fill="#d62728"/>
<rect x="70" y="319" width="12" height="12" fill="#d62728"/><text x="88" y="329">diff, 5th derivative of x^k e^x sin(x)</text>
<circle cx="405.0" cy="140.2" r="3" fill="#2ca02c"/>
<rect x="70" y="337" width="12" height="12" fill="#2ca02c"/><text x="88" y="347">integrate x^k e^x</text>
<circle cx="405.0" cy="141.1" r="3" fill="#9467bd"/>
<rect x="70" y="355" width="12" height="12" fill="#9467bd"/><text x="88" y="365">series of sin(x) e^(kx), order 10</text>
<circle cx="405.0" cy="137.7" r="3" fill="#ff7f0e"/>
<rect x="70" y="373" width="12" height="12" fill="#ff7f0e"/><text x="88" y="383">limit of (sin(kx) - kx) / x^3 at 0</text>
</svg>
