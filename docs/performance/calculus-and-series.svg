<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" font-family="sans-serif" font-size="12">
<title>Calculus and series</title>
<rect width="760" height="410" fill="white"/>
<line x1="70" x2="740" y1="165.3" y2="165.3" stroke="#e5e5e5"/><text x="64" y="169.3" text-anchor="end">×1</text>
<line x1="70" x2="740" y1="165.3" y2="165.3" stroke="black" stroke-dasharray="5 3"/><text x="740" y="161.3" text-anchor="end">as fast as the reference</text>
<text x="70.0" y="276" text-anchor="middle" font-size="10">2026-11-25 b44083f</text>
<text x="740.0" y="276" text-anchor="middle" font-size="10">2026-11-25 dff4757</text>
<polyline points="70.0,165.0 740.0,148.9" fill="none" stroke="#1f77b4" stroke-width="2"/>
<circle cx="70.0" cy="165.0" r="3" fill="#1f77b4"/>
<circle cx="740.0" cy="148.9" r="3" fill="#1f77b4"/>
<rect x="70" y="301" width="12" height="12" fill="#1f77b4"/><text x="88" y="311">expand((x + k)^20)</text>
<polyline points="70.0,166.2 740.0,161.4" fill="none" stroke="#d62728" stroke-width="2"/>
<circle cx="70.0" cy="166.2" r="3" fill="#d62728"/>
<circle cx="740.0" cy="161.4" r="3" fill="#d62728"/>
<rect x="70" y="319" width="12" height="12" fill="#d62728"/><text x="88" y="329">diff, 5th derivative of x^k e^x sin(x)</text>
<polyline points="70.0,164.6 740.0,163.0" fill="none" stroke="#2ca02c" stroke-width="2"/>
<circle cx="70.0" cy="164.6" r="3" fill="#2ca02c"/>
<circle cx="740.0" cy="163.0" r="3" fill="#2ca02c"/>
<rect x="70" y="337" width="12" height="12" fill="#2ca02c"/><text x="88" y="347">integrate x^k e^x</text>
<polyline points="70.0,165.3 740.0,153.0" fill="none" stroke="#9467bd" stroke-width="2"/>
<circle cx="70.0" cy="165.3" r="3" fill="#9467bd"/>
<circle cx="740.0" cy="153.0" r="3" fill="#9467bd"/>
<rect x="70" y="355" width="12" height="12" fill="#9467bd"/><text x="88" y="365">series of sin(x) e^(kx), order 10</text>
<polyline points="70.0,162.6 740.0,113.8" fill="none" stroke="#ff7f0e" stroke-width="2"/>
