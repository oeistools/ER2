<svg xmlns="http://www.w3.org/2000/svg" width="760" height="374" font-family="sans-serif" font-size="12">
<title>Exact rationals and large integers</title>
<rect width="760" height="374" fill="white"/>
<line x1="70" x2="740" y1="217.5" y2="217.5" stroke="#e5e5e5"/><text x="64" y="221.5" text-anchor="end">×1</text>
<line x1="70" x2="740" y1="108.9" y2="108.9" stroke="#e5e5e5"/><text x="64" y="112.9" text-anchor="end">×2</text>
<line x1="70" x2="740" y1="217.5" y2="217.5" stroke="black" stroke-dasharray="5 3"/><text x="740" y="213.5" text-anchor="end">as fast as the reference</text>
<text x="70.0" y="276" text-anchor="middle" font-size="10">2026-11-25 b44083f</text>
<text x="740.0" y="276" text-anchor="middle" font-size="10">2026-11-25 dff4757</text>
<polyline points="70.0,56.0 740.0,153.1" fill="none" stroke="#1f77b4" stroke-width="2"/>
<circle cx="70.0" cy="56.0" r="3" fill="#1f77b4"/>
<circle cx="740.0" cy="153.1" r="3" fill="#1f77b4"/>
<rect x="70" y="301" width="12" height="12" fill="#1f77b4"/><text x="88" y="311">`a + b`, rationals</text>
<polyline points="70.0,64.1 740.0,141.7" fill="none" stroke="#d62728" stroke-width="2"/>
<circle cx="70.0" cy="64.1" r="3" fill="#d62728"/>
<circle cx="740.0" cy="141.7" r="3" fill="#d62728"/>
<rect x="70" y="319" width="12" height="12" fill="#d62728"/><text x="88" y="329">`a * b / (a - b)`, rationals</text>
<polyline points="70.0,216.2 740.0,224.0" fill="none" stroke="#2ca02c" stroke-width="2"/>
<circle cx="70.0" cy="216.2" r="3" fill="#2ca02c"/>
<circle cx="740.0" cy="224.0" r="3" fill="#2ca02c"/>
<rect x="70" y="337" width="12" height="12" fill="#2ca02c"/><text x="88" y="347">`3^20000 * 3^20000`, large integers</text>
</svg>
