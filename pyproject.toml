[project]
name = "er2"
version = "0.7.0"
description = "ER2 — mathematical Python: symbolic syntax, exact arithmetic and PARI/GP number theory on top of Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Enrique Pérez Herrero", email = "energycode.org@gmail.com" }]
maintainers = [{ name = "Enrique Pérez Herrero", email = "energycode.org@gmail.com" }]
keywords = [
    "mathematics",
    "computer-algebra",
    "number-theory",
    "symbolic",
    "exact-arithmetic",
    "pari",
    "sympy",
    "preparser",
]
# No "License ::" classifier: PEP 639 forbids it beside the SPDX
# ``license`` field above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Interpreters",
    "Framework :: Jupyter",
    "Operating System :: OS Independent",
]
dependencies = [
    "sympy>=1.14",
    "cypari2>=2.2",
]

[project.optional-dependencies]
# ER2 Jupyter kernel and %load_ext er2 (ARCHITECTURE.md §1.2).
jupyter = ["ipykernel>=6.29"]
# er2.oeis: OEIS lookup, search, checks and b-files (ARCHITECTURE.md §10).
oeis = ["oeis-tools>=0.2.1"]

[project.scripts]
er2 = "er2.__main__:main"

[project.urls]
Documentation = "https://oeistools.github.io/ER2/"
Repository = "https://github.com/oeistools/ER2"
Issues = "https://github.com/oeistools/ER2/issues"
Changelog = "https://github.com/oeistools/ER2/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Notebook tests: run the ER2 kernel and %load_ext er2 (§1.2).
    "ipykernel>=6.29",
    "nbclient>=0.10",
    # Quarto's Jupyter bridge runs on this Python and imports yaml.
    "pyyaml>=6",
    # er2.oeis tests (they use recorded OEIS responses, not the network).
    "oeis-tools>=0.2.1",
    # The figure in examples/article.qmd, and the Matplotlib half of
    # tests/compat/test_scientific.py: a scientific article needs plots
    # (ARCHITECTURE.md §1.3).  ER2 wraps nothing here; this is the kernel's
    # interpreter needing the library the document imports.
    "matplotlib>=3.9",
    # The rest of tests/compat/test_scientific.py.  The README promises
    # that the whole ecosystem works through a normal import and names
    # "NumPy, SciPy, pandas, Matplotlib"; a promise nothing imports is a
    # promise nothing checks (PLAN.md, M7 task 3).  NumPy needs no entry:
    # Matplotlib, pandas and SciPy all require it.  ER2 wraps none of
    # them, so these are test-only and never runtime dependencies.
    "pandas>=2.2",
    "scipy>=1.13",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 79  # PEP 8
# ER2 notebooks contain ER2 syntax (`sym x`, `^^`), which ruff cannot parse
# (ARCHITECTURE.md §6.1).
extend-exclude = ["examples/*.ipynb"]

[tool.ruff.lint]
# pycodestyle (E, W), pyflakes (F), isort (I), pep8-naming (N), pydocstyle/PEP 257 (D)
select = ["E", "W", "F", "I", "N", "D"]

[tool.ruff.lint.per-file-ignores]
# Tests are not public API: docstrings optional (PEP 257 covers the package).
"tests/**" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
testpaths = ["tests"]
