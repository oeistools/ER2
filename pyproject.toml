[project]
name = "er2"
version = "0.4.2"
description = "ER2 — mathematical Python: symbolic syntax, exact arithmetic and PARI/GP number theory on top of Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.14",
    "cypari2>=2.2",
]

[project.optional-dependencies]
# ER2 Jupyter kernel and %load_ext er2 (ARCHITECTURE.md §1.2).
jupyter = ["ipykernel>=6.29"]
# er2.oeis: OEIS lookup, search, checks and b-files (ARCHITECTURE.md §10).
oeis = ["oeis-tools>=0.2.1"]

[project.scripts]
er2 = "er2.__main__:main"

[project.urls]
Repository = "https://github.com/oeistools/ER2"
Issues = "https://github.com/oeistools/ER2/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Notebook tests: run the ER2 kernel and %load_ext er2 (§1.2).
    "ipykernel>=6.29",
    "nbclient>=0.10",
    # Quarto's Jupyter bridge runs on this Python and imports yaml.
    "pyyaml>=6",
    # er2.oeis tests (they use recorded OEIS responses, not the network).
    "oeis-tools>=0.2.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 79  # PEP 8
# ER2 notebooks contain ER2 syntax (`sym x`, `^^`), which ruff cannot parse
# (ARCHITECTURE.md §6.1).
extend-exclude = ["examples/*.ipynb"]

[tool.ruff.lint]
# pycodestyle (E, W), pyflakes (F), isort (I), pep8-naming (N), pydocstyle/PEP 257 (D)
select = ["E", "W", "F", "I", "N", "D"]

[tool.ruff.lint.per-file-ignores]
# Tests are not public API: docstrings optional (PEP 257 covers the package).
"tests/**" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
testpaths = ["tests"]
